<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>웹 프로그래밍</title>
  </head>
  <body>
    <div id="container">
      <h1>웹 프로그래밍</h1>
      <!-- p태그 생성 -->
    </div>
    <div class="notice">
      <!-- js 출력 - <span>안녕하세요</span>-->
    </div>
    <script>
      //p태그생성
      const newP = document.createElement("p");
      console.log(newP);
      const txtNode = document.createTextNode(
        "DOM은 Document object model의 줄임말이다.",
      );
      console.log(txtNode);
      //p태그에 글자를 넣는다.
      newP.appendChild(txtNode);
      //container 영역안에 p태그 연결
      document.querySelector("#container").appendChild(newP);
      const Notice = document.createElement("span");
      console.log(Notice);
      const noticetxt = document.createTextNode("안녕하세요");
      console.log(noticetxt);
      Notice.appendChild(noticetxt);
      document.querySelector(".notice").appendChild(Notice);
    </script>
  </body>
</html>
