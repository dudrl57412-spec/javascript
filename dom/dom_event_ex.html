<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #result span {
        color: red;
      }
      #big {
        width: 200px;
        border: 3px solid #333;
      }
      .imgBox img {
        width: 100px;
        border: 3px solid transparent;
        transition: all 0.3s;
      }
      .imgBox img:hover {
        border-color: red;
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <ul id="menu">
      <li>회사소개</li>
      <li>제품소개</li>
      <li>고객센터</li>
    </ul>
    <div id="result">
      <!-- 내가 클릭한 글자 js 출력 -->
    </div>
    <!-- 클릭한 이미지 크게 보이기 -->
    <!-- 큰이미지 -->
    <img src="/images/images/cup-1.png" alt="redcup" id="big" />
    <!-- 작은이미지 -->
    <div class="imgBox">
      <img src="/images/images/cup-1.png" alt="" />
      <img src="/images/images/cup-2.png" alt="" />
    </div>
    <script>
      const menu = document.querySelector("#menu");
      const result = document.querySelector("#result");

      menu.addEventListener("click", (e) => {
        console.log(e.target);
        // alert(`${e.target.innerText}클릭`);
        result.innerHTML = `
      <p>내가 클릭한 메뉴 : <span>${e.target.innerText}</span></P>
              `;
      });
      //작은 이미지 클릭시
      const imgBox = document.querySelector(".imgBox");
      const big = document.querySelector("#big");
      imgBox.addEventListener("click", (e) => {
        console.log(e.target.src);
        //큰 이미지 변경
        big.src = e.target.src;
      });
    </script>
  </body>
</html>
